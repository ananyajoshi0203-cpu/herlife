<title>HerLife</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a phone-shaped app shell, centered on desktop, full-bleed on phones. The accent follows her cycle phase. */
:root {
  --bg: #F8F3F6; --surface: #FFFFFF; --surface-2: #F4ECF1; --ink: #2B1E29; --muted: #776873; --line: #EBDFE7;
  --ph-men: #BE3A62; --ph-fol: #2F86C8; --ph-ovu: #D45A98; --ph-lut: #4F5DC0;
  --good: #2F7BC4; --warn: #A84A6E; --nourish: #3C9A5F; --frame: #E9DCE5;
  --ease: cubic-bezier(.22, 1, .36, 1);
  --accent: var(--ph-fol); --accent-ink: #FFFFFF;
  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --f-data: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --r-lg: 22px; --r-md: 14px; --r-sm: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #151015; --surface: #201920; --surface-2: #2B222A; --ink: #F5EBF2; --muted: #B3A1AE; --line: #3A2E38;
  --ph-men: #F27C9C; --ph-fol: #78BFF2; --ph-ovu: #F49AC6; --ph-lut: #9CA6F7; --good: #7DB8F2; --warn: #E486A8; --nourish: #6BCB8C; --frame: #0C080B;
  --accent-ink: #160F18; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #151015; --surface: #201920; --surface-2: #2B222A; --ink: #F5EBF2; --muted: #B3A1AE; --line: #3A2E38;
  --ph-men: #F27C9C; --ph-fol: #78BFF2; --ph-ovu: #F49AC6; --ph-lut: #9CA6F7; --good: #7DB8F2; --warn: #E486A8; --nourish: #6BCB8C; --frame: #0C080B;
  --accent-ink: #160F18; color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--frame); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
* { box-sizing: border-box; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: 30px; line-height: 1.08; font-weight: 800; }
h2 { font-size: 21px; font-weight: 700; }
h3 { font-size: 16px; font-weight: 700; }
p { margin: 0; }
.mono { font-family: var(--f-data); font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }

#app[data-phase="menstrual"] { --accent: var(--ph-men); }
#app[data-phase="follicular"] { --accent: var(--ph-fol); }
#app[data-phase="ovulatory"] { --accent: var(--ph-ovu); }
#app[data-phase="luteal"] { --accent: var(--ph-lut); }

#app { height: 100%; max-width: 440px; margin: 0 auto; background: var(--bg); display: flex; flex-direction: column; position: relative; overflow: hidden; transition: --accent .4s; }
@media (min-width: 600px) {
  body { display: grid; place-items: center; padding: 16px; }
  #app { height: min(900px, calc(100vh - 32px)); width: 420px; border-radius: 38px; box-shadow: 0 30px 80px -20px rgba(40, 10, 40, .35), 0 0 0 10px var(--surface); }
}
.scroll { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
.screen { padding-block: 20px 28px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 16px; }

/* Ambient phase glow behind the header */
.glow { position: absolute; inset: -120px -80px auto; height: 340px; background: radial-gradient(closest-side, color-mix(in oklab, var(--accent) 30%, transparent), transparent); filter: blur(10px); pointer-events: none; z-index: 0; transition: background .5s; }
.scroll, .tabbar, .topbar { position: relative; z-index: 1; }

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px max(18px, env(safe-area-inset-right, 0px)) 4px max(18px, env(safe-area-inset-left, 0px)); }
.brand { font-family: var(--f-display); font-weight: 800; font-size: 22px; display: flex; align-items: center; gap: 8px; }
.brand-mark { width: 26px; height: 26px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--muted); border: 0; }
.pill.accent { background: color-mix(in oklab, var(--accent) 16%, var(--surface)); color: var(--accent); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; display: inline-block; }

.card { background: var(--surface); border-radius: var(--r-lg); padding: 16px; border: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.card.flat { background: var(--surface-2); border-color: transparent; }
.row { display: flex; align-items: center; gap: 10px; }
.row.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

.btn { border: 0; border-radius: 99px; padding: 13px 20px; font-weight: 700; background: var(--accent); color: var(--accent-ink); display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform .15s, filter .15s; }
.btn:active { transform: scale(.97); }
.btn:hover { filter: brightness(1.05); }
.btn.block { width: 100%; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn.soft { background: color-mix(in oklab, var(--accent) 14%, var(--surface)); color: var(--accent); }
.btn.small { padding: 8px 14px; font-size: 13px; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.link { background: none; border: 0; color: var(--accent); font-weight: 700; padding: 4px 0; }

.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; font-weight: 600; color: var(--muted); }
.input { width: 100%; border: 1.5px solid var(--line); background: var(--surface); border-radius: var(--r-md); padding: 12px 14px; }
.input:focus { border-color: var(--accent); outline: none; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 99px; padding: 8px 14px; font-size: 14px; font-weight: 500; transition: all .15s; }
.chip.on { border-color: var(--accent); background: color-mix(in oklab, var(--accent) 14%, var(--surface)); color: var(--accent); font-weight: 700; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border-radius: 99px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: transparent; border-radius: 99px; padding: 9px 6px; font-weight: 600; font-size: 13px; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.08); }

/* Onboarding */
.progress { display: flex; gap: 6px; }
.progress span { flex: 1; height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; position: relative; }
.progress span.on::after { content: ""; position: absolute; inset: 0; background: var(--accent); animation: grow .5s ease-out both; transform-origin: left; }
@keyframes grow { from { transform: scaleX(0); } }
.hero-art { height: 250px; position: relative; margin-inline: -18px; overflow: hidden; }
.hero-art canvas { width: 100%; height: 100%; display: block; }
.promise { display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: start; }
.promise .ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: color-mix(in oklab, var(--accent) 14%, var(--surface)); color: var(--accent); }
.toggle { appearance: none; width: 44px; height: 26px; border-radius: 99px; background: var(--line); position: relative; transition: background .2s; flex: none; border: 0; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.toggle:checked { background: var(--accent); }
.toggle:checked::after { transform: translateX(18px); }
.goal { text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: var(--r-md); padding: 14px; display: flex; flex-direction: column; gap: 4px; transition: all .15s; min-width: 0; }
.goal b { font-family: var(--f-display); font-size: 15px; }
.goal small { color: var(--muted); font-size: 12px; }
.goal.on { border-color: var(--accent); background: color-mix(in oklab, var(--accent) 10%, var(--surface)); box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 18%, transparent); }
.connect { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; }
.logo { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--ink); color: var(--bg); font-family: var(--f-display); font-weight: 800; }
.sync-bar { height: 6px; border-radius: 6px; background: var(--line); overflow: hidden; grid-column: 1 / -1; }
.sync-bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s linear; }

/* Thinking state */
.thinking { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 30px 0; text-align: center; }
.orb { width: 90px; height: 90px; border-radius: 50%; background: conic-gradient(from 0deg, var(--ph-men), var(--ph-ovu), var(--ph-fol), var(--ph-lut), var(--ph-men)); animation: spin 2.4s linear infinite, morph 3s ease-in-out infinite; filter: blur(1px); }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes morph { 0%,100% { border-radius: 50% 50% 50% 50%; } 33% { border-radius: 58% 42% 55% 45%; } 66% { border-radius: 44% 56% 46% 54%; } }

/* Habits */
.habit { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
.habit-title { font-weight: 700; }
.check { width: 40px; height: 40px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; transition: all .2s; color: transparent; }
.check.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); animation: pop .35s; }
@keyframes pop { 50% { transform: scale(1.18); } }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; grid-column: 1 / -1; }
.week div { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; color: var(--muted); }
.week i { width: 100%; height: 8px; border-radius: 4px; background: var(--line); display: block; }
.week i.on { background: var(--accent); }
.week i.today { outline: 1.5px solid var(--accent); outline-offset: 1px; }
.impact { border-top: 1px dashed var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 8px; }
.delta { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 99px; font-family: var(--f-data); font-size: 12px; font-weight: 500; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.delta svg { width: 12px; height: 12px; flex: none; }
.delta.good { background: color-mix(in oklab, var(--good) 14%, var(--surface)); color: var(--good); }
.delta.bad { background: color-mix(in oklab, var(--warn) 14%, var(--surface)); color: var(--warn); }
.fresh .delta { animation: rise .55s cubic-bezier(.2,.8,.2,1) both; }
.vs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; height: 76px; max-width: 200px; }
.vs div { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 3px; height: 100%; font-size: 11px; color: var(--muted); min-width: 0; }
.vs b { font-family: var(--f-data); font-size: 11.5px; color: var(--ink); font-weight: 500; }
.vs i { width: 100%; border-radius: 6px 6px 2px 2px; display: block; background: var(--accent); animation: barUp .6s cubic-bezier(.2,.8,.2,1) both; transform-origin: bottom; }
.vs div + div i { background: var(--line); animation-delay: .08s; }
.changed-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13.5px; }
.changed-row span:first-child { min-width: 0; overflow-wrap: anywhere; }

/* Today */
.ready { display: grid; grid-template-columns: 116px 1fr; gap: 14px; align-items: center; }
.ring-wrap { position: relative; width: 116px; height: 116px; }
.ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-wrap .val { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.ring-wrap .val b { font-family: var(--f-display); font-size: 32px; line-height: 1; display: block; }
.ring-arc { transition: stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1); }
.metric b { font-family: var(--f-data); font-size: 17px; display: block; font-variant-numeric: tabular-nums; }
.metric span { font-size: 11px; color: var(--muted); }
.ease { background: linear-gradient(135deg, color-mix(in oklab, var(--ph-lut) 20%, var(--surface)), color-mix(in oklab, var(--ph-men) 14%, var(--surface))); border: 0; position: relative; overflow: hidden; }
.ease::after { content: ""; position: absolute; width: 160px; height: 160px; right: -50px; top: -60px; border-radius: 50%; background: color-mix(in oklab, var(--surface) 40%, transparent); animation: breathe 5s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(1.25); opacity: .5; } }
.timeline { display: flex; flex-direction: column; }
.tl { display: grid; grid-template-columns: 52px 14px 1fr; gap: 10px; min-height: 40px; }
.tl .t { font-family: var(--f-data); font-size: 12px; color: var(--muted); padding-top: 2px; }
.tl .rail { display: flex; flex-direction: column; align-items: center; }
.tl .rail i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); margin-top: 5px; flex: none; }
.tl .rail s { flex: 1; width: 2px; background: var(--line); }
.tl.plan .rail i { background: var(--accent); box-shadow: 0 0 0 4px color-mix(in oklab, var(--accent) 22%, transparent); }
.tl .what { padding-bottom: 12px; min-width: 0; }
.tl.plan .what b { color: var(--accent); }
.tl .what small { color: var(--muted); display: block; }
.feature { display: grid; grid-template-columns: 54px 1fr; gap: 12px; align-items: start; }
.feature .art { width: 54px; height: 54px; border-radius: 16px; background: color-mix(in oklab, var(--accent) 16%, var(--surface)); display: grid; place-items: center; color: var(--accent); }
details summary { cursor: pointer; font-weight: 700; color: var(--accent); list-style: none; font-size: 14px; }
details summary::-webkit-details-marker { display: none; }
details ol, details ul { margin: 8px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.scrub { display: flex; flex-direction: column; gap: 6px; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.win { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; }
.win .star { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); }

.stages { display: flex; height: 16px; border-radius: 8px; overflow: hidden; gap: 2px; }
.stages i { display: block; animation: grow .7s ease-out both; transform-origin: left; }
.mind { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.mind > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.mind b { font-size: 18px; }
.mind svg { max-width: 100%; }
.persona { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: center; text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r-md); padding: 12px; transition: border-color .15s, transform .15s; }
.persona:hover { border-color: var(--accent); transform: translateY(-1px); }
.avatar { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--surface); font-family: var(--f-display); font-weight: 800; font-size: 18px; }
.busyweek { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; height: 54px; align-items: end; }
.busyweek div { display: flex; flex-direction: column; align-items: center; gap: 3px; height: 100%; justify-content: flex-end; font-size: 10px; color: var(--muted); }
.busyweek i { width: 100%; border-radius: 999px; display: block; min-height: 6px; animation: barUp .7s var(--ease) both; transform-origin: bottom; }
.pillars { display: grid; grid-template-columns: repeat(auto-fit, minmax(56px, 1fr)); gap: 6px; }
.pillar { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; color: var(--muted); }
.ring-wrap.sm { width: 56px; height: 56px; }
.ring-wrap.sm .val b { font-family: var(--f-data); font-size: 14px; }
.weeks { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; align-items: end; }
.wk { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); text-align: center; }
.wk .bar { width: 100%; height: 110px; background: var(--surface-2); border-radius: 999px; display: flex; align-items: flex-end; overflow: hidden; }
.wk .bar i { display: block; width: 100%; background: linear-gradient(color-mix(in oklab, var(--accent) 70%, var(--surface)), var(--accent)); border-radius: 999px; animation: barUp .9s var(--ease) both; transform-origin: bottom; }
.wk:last-child .bar i { background: linear-gradient(var(--accent), color-mix(in oklab, var(--accent) 60%, var(--ph-ovu))); }
.wk b { color: var(--ink); font-size: 13px; }
@keyframes barUp { from { transform: scaleY(0); } }
.month { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; }
.month i { aspect-ratio: 1; border-radius: 4px; background: var(--line); display: block; }
.month i.on { background: var(--accent); }
.month i.today { outline: 2px solid var(--accent); outline-offset: 1px; }

.deck { position: relative; height: 190px; outline: none; }
.swipe-card { position: absolute; inset: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 20px; display: flex; flex-direction: column; gap: 6px; justify-content: center;
  transform: translateY(calc(var(--depth) * 10px)) scale(calc(1 - var(--depth) * .05)); opacity: calc(1 - var(--depth) * .25); touch-action: pan-y; user-select: none; cursor: grab; box-shadow: 0 14px 30px -18px rgba(40,10,40,.4); overflow: hidden; }
.swipe-card[style*="--depth:0"] { background: linear-gradient(160deg, var(--surface), color-mix(in oklab, var(--accent) 10%, var(--surface))); }
.stamp { position: absolute; top: 16px; padding: 4px 12px; border: 3px solid; border-radius: 10px; font-family: var(--f-display); font-weight: 800; font-size: 18px; opacity: 0; transition: opacity .15s; text-transform: uppercase; }
.stamp.yes { right: 16px; color: var(--good); transform: rotate(10deg); }
.stamp.no { left: 16px; color: var(--warn); transform: rotate(-10deg); }
.lean-yes .stamp.yes, .lean-no .stamp.no { opacity: 1; }
.deck:focus-visible .swipe-card[style*="--depth:0"] { outline: 2px solid var(--accent); }
.gapbars { display: flex; gap: 8px; align-items: flex-end; height: 70px; }
.gapbars div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; height: 100%; justify-content: flex-end; font-size: 11px; }
.gapbars i { width: 100%; border-radius: 999px; display: block; min-height: 8px; animation: barUp .7s var(--ease) both; transform-origin: bottom; }

/* Log composer */
.mic-zone { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 10px 0 4px; }
.mic { width: 96px; height: 96px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; position: relative; box-shadow: 0 12px 30px -10px var(--accent); }
.mic.live::before, .mic.live::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--accent); animation: ripple 1.6s ease-out infinite; }
.mic.live::after { animation-delay: .8s; }
@keyframes ripple { to { transform: scale(1.8); opacity: 0; } }
.wave { display: flex; gap: 3px; height: 28px; align-items: center; }
.wave i { width: 4px; border-radius: 3px; background: var(--accent); height: 4px; transition: height .1s; }
.wave.live i { animation: wv 0.9s ease-in-out infinite; }
@keyframes wv { 50% { height: 26px; } }
textarea.input { min-height: 110px; resize: vertical; }
.buckets { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.bucket { border-radius: var(--r-md); padding: 12px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.bucket.wide { grid-column: 1 / -1; }
.bucket h3 { font-size: 13px; display: flex; align-items: center; gap: 6px; }
.bucket h3 i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.entry { font-size: 13.5px; padding: 7px 10px; border-radius: 10px; background: var(--surface-2); animation: fly .5s cubic-bezier(.2,.9,.3,1.2) both; overflow-wrap: anywhere; }
.entry small { display: block; color: var(--muted); font-size: 11.5px; }
@keyframes fly { from { opacity: 0; transform: translateY(-24px) scale(.9); } }

/* Cycle */
.cycle-ring { position: relative; width: 100%; max-width: 300px; margin: 0 auto; aspect-ratio: 1; }
.cycle-ring svg { width: 100%; height: 100%; }
.cycle-ring .center { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; pointer-events: none; }
.cycle-ring .center b { font-family: var(--f-display); font-size: 46px; line-height: 1; display: block; }
.seg-arc { transition: opacity .3s; animation: arcIn .6s both; }
@keyframes arcIn { from { opacity: 0; } }

/* No logged periods yet: estimate starts from the temperature drop that follows a warm luteal run.
   Warm is the midpoint of her own 25th and 75th percentile, not the median: in cycles of 28 days
   or less the warm half holds most nights and the median lands inside it. No spread means no
   shift (for example on the pill). A start needs two cool nights so one noisy night is not a period. */
function startsFromTemperature(rows) {
  const temps = rows.map((r) => r.temp).filter(Number.isFinite).sort((a, b) => a - b);
  if (temps.length < 20) return [];
  const lo = temps[Math.floor(temps.length / 4)], hi = temps[Math.floor(3 * temps.length / 4)];
  if (hi - lo < 0.15) return [];
  const warmAt = (lo + hi) / 2;
  const starts = []; let warm = 0, coolDay = null;
  for (const r of rows) {
    if (!Number.isFinite(r.temp)) continue;
    if (r.temp >= warmAt) { warm++; coolDay = null; continue; }
    if (warm >= 8 && coolDay) { starts.push(coolDay); warm = 0; coolDay = null; continue; }
    if (warm >= 8) { coolDay = r.day; continue; }
    warm = 0;
  }
  return starts;
}

function arcPath(cx, cy, r, a0, a1) {

function tempChart() {

let petalRaf = 0;
function startPetals() {
  cancelAnimationFrame(petalRaf);
  const c = document.getElementById("petals"); if (!c) return;
  const ctx2 = c.getContext("2d"), dpr = window.devicePixelRatio || 1;
  const w = c.clientWidth, h = c.clientHeight; c.width = w * dpr; c.height = h * dpr; ctx2.scale(dpr, dpr);
  const styles = getComputedStyle(document.documentElement);
  const colors = ["--ph-men", "--ph-fol", "--ph-ovu", "--ph-lut"].map((t) => styles.getPropertyValue(t).trim());

    ctx2.clearRect(0, 0, w, h);
    const cx = w / 2, cy = h / 2 + 6;
    for (let ring = 0; ring < 4; ring++) {
      const n = 7 + ring * 2;
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2 + t * 0.00012 * (ring % 2 ? -1 : 1) + ring;
        const len = 46 + ring * 20 + Math.sin(t * 0.0012 + i) * 5;
        ctx2.save(); ctx2.translate(cx, cy); ctx2.rotate(a);
        ctx2.globalAlpha = 0.5 - ring * 0.08; ctx2.fillStyle = colors[(i + ring) % 4];
        ctx2.beginPath(); ctx2.ellipse(len * 0.55 + ring * 8, 0, len * 0.5, 11 + ring * 2, 0, 0, Math.PI * 2); ctx2.fill(); ctx2.restore();

}

function seedHabitHistory(habits) {
  const rows = rowsByDay(), checks = {};
  const days = Array.from({ length: 27 }, (_, i) => addDays(TODAY, -(i + 1)));
  for (const h of habits) {
    const key = leverFor(h).outcomes[0], { better } = OUTCOMES[key];
    const known = days.map((d) => outcomeAfter(rows, key, d)).filter((v) => v != null).sort((a, b) => a - b);

    const rng = mulberry(hashStr(h.title));
    for (const d of days) {
      const v = outcomeAfter(rows, key, d);
      const odds = v == null ? 0.68 : (v - median) * better > 0 ? 0.84 : 0.48;
      if (rng() < odds) checks[`${h.id}|${d}`] = true;

}

    Object.assign(state, { profile: { ...defaultState().profile, ...pr.profile, cycleLen: pr.len || 29, dayType: pr.dayType }, calendarProvider: pr.noCalendar ? null : "google", connected: { oura: !pr.noWearable, calendar: !pr.noCalendar }, goals: [...pr.goals], periods: [], checkins: pr.noWearable ? demoCheckins() : {}, persona: d.persona, booked: [], aiPlan: null, summary: null, previewCd: null });
    applyDataSource();
    if (pr.cd) { const last = addDays(TODAY, -(pr.cd - 1)); state.periods = [2, 1, 0].map((k) => addDays(last, -k * pr.len)); }
    else if (pr.gaps) { let day = addDays(TODAY, -(pr.gaps.reduce((a, b) => a + b, 0) + 6)); state.periods = [day]; for (const g of pr.gaps) { day = addDays(day, g); state.periods.push(day); } }
    else seedPeriods();
    makeHabits(); return;
  }
  if (d.daytype) { state.profile.dayType = d.daytype; if (state.connected.calendar) toast(`Calendar switched to ${DAY_TYPES[d.daytype].label.toLowerCase()} demo`); set({}); return; }
  if (d.stage) { state.profile.lifeStage = d.stage; set({}); return; }
  if (d.toggle) { const list = state.profile[d.toggle]; const i = list.indexOf(d.val); i >= 0 ? list.splice(i, 1) : list.push(d.val); set({}); return; }
  if (d.goal) { const g = state.goals; const i = g.indexOf(d.goal); if (i >= 0) g.splice(i, 1); else { g.push(d.goal); if (g.length > 2) g.shift(); } set({}); return; }
  if (d.connect === "calendar") {
    if (window.claude?.hosted && d.provider === "google" && ui.googleReady) { window.claude.use("calendar").then((cal) => cal.connect()); return; }
    state.calendarProvider = d.provider || "google";
    const label = CAL_PROVIDERS.find(([k]) => k === state.calendarProvider)[1];
    const steps = [`Opening ${label}`, "Requesting read and write access", "Reading this week", `Found ${dayType().events.length} events today, ${dayType().week.reduce((a, b) => a + b, 0)} busy hours this week`];
    ui.syncing = "calendar"; ui.syncStep = steps[0]; render(); let pct = 0;
    const iv = setInterval(() => {
      pct += 5; const bar = document.getElementById("sync-calendar"); if (bar) bar.style.width = Math.min(100, pct) + "%";
      const next = steps[Math.min(steps.length - 1, Math.floor(pct / 26))]; if (next !== ui.syncStep) { ui.syncStep = next; render(); const b = document.getElementById("sync-calendar"); if (b) b.style.width = pct + "%"; }
      if (pct >= 100) { clearInterval(iv); ui.syncing = null; state.connected.calendar = true; set({}); toast(`${label} connected`); }
    }, 70);
    return;
  }
  if (d.connect) {
    ui.syncing = d.connect; render(); let pct = 0;
    /* Simulated for the demo; set ui.ouraReal = true to try the live connector instead. */
    const real = d.connect !== "oura" ? Promise.resolve(null) : ui.ouraReal ? syncOura() : Promise.resolve({ mode: "demo", note: `Oura connected. Synced ${SEED.length} nights of sleep, HRV, and temperature.` });
    const ouraSteps = ["Opening Oura", "Authorizing HerLife", "Syncing 90 nights", "Reading HRV and temperature"];
    const iv = setInterval(() => { pct += 4; const bar = document.getElementById("sync-" + d.connect); if (bar) bar.style.width = Math.min(100, pct) + "%";
      if (d.connect === "oura") { const step = ouraSteps[Math.min(3, Math.floor(pct / 26))]; const label = document.getElementById("sync-step-oura"); if (label) label.textContent = step; }
      if (pct >= 100) { clearInterval(iv); real.then((r) => { ui.syncing = null; state.connected[d.connect] = true; if (r) state.connected.ouraMode = r.mode; applyDataSource(); set({}); toast(r ? r.note : "Calendar connected"); }); } }, 70);
    return;
  }
  if (d.check) {
    const k = `${d.check}|${TODAY}`; const on = !state.checks[k];
    if (on) state.checks[k] = true; else delete state.checks[k];
    set({});
    if (on) confetti(document.querySelector(`[data-check="${d.check}"]`));
    if (on && state.habits.every((h) => state.checks[`${h.id}|${TODAY}`])) toast("All three done today. That's a streak builder.");
    return;
  }
  if (d.swipeBtn) { const top = document.querySelector('.swipe-card[style*="--depth:0"]'); if (top) resolveSwipe(top.dataset.swipe, d.swipeBtn); return; }
  if (d.ciSet) { ui.checkinDraft[d.ciSet] = Number(d.val); render(); return; }
  if (d.seasonHabit != null) {
    const rec = seasonNow()[1].recs[Number(d.seasonHabit)];
    const habit = { ...rec.habit, id: "s" + Date.now().toString(36) };
    state.habits.push(habit); save(); render(); toast(`Added "${habit.title}" to your habits`); return;
  }
  if (d.ramble != null) { ui.draft = SAMPLE_RAMBLES[+d.ramble]; render(); return; }
  if (d.symptom) {
    const i = state.logs.findIndex((l) => l.day === TODAY && l.symptom === d.symptom);
    if (i >= 0) state.logs.splice(i, 1); else state.logs.push({ id: Date.now(), day: TODAY, category: "symptoms", text: d.symptom, symptom: d.symptom, detail: `Cycle day ${dayContext().cd}` });
    set({}); return;
  }
  if (d.mood) {
    state.moods.push({ day: TODAY, ts: Date.now(), mood: d.mood });
    state.logs.push({ id: Date.now(), day: TODAY, category: "mood", text: `Feeling ${moodById(d.mood).label.toLowerCase()}`, detail: `Check-in · REM ${Number.isFinite(dayContext().row.rem) ? remPct(dayContext().row) + "%" : "n/a"} last night` });
    ui.moodOpen = false; state.lastMoodAt = Date.now(); save(); toast("Logged. Thank you for checking in."); return;
  }
  switch (d.action) {
    case "demo":
      Object.assign(state, { profile: { name: "Maya", email: "maya@example.com", age: "32", gym: "gym", diet: ["Vegetarian"], conditions: ["Migraines"], lastPeriod: "", cycleLen: 29 }, connected: { oura: true, calendar: true }, goals: ["pms", "sleep"], periods: [] });
      seedPeriods();
      makeHabits(); break;
    case "make-habits": makeHabits(); break;
    case "new-habits": makeHabits().then(() => set({ step: "app", tab: "habits" })); break;
    case "skip-ai": skipAi = true; break;
    case "start-signup": state = { ...defaultState(), step: "account" }; applyDataSource(); save(); render(); break;
    case "create-account": {
      const p = state.profile;
      if (!p.name.trim() || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(p.email)) { toast("Add your first name and a valid email to continue"); break; }
      Object.assign(state, { persona: null, periods: [], checkins: {}, habits: [], checks: {}, logs: [], moods: [], booked: [], connected: { oura: false, calendar: false }, calendarProvider: null });
      set({ step: "about" }); toast(`Welcome, ${p.name.trim()}`); break;
    }
    case "finish": applyDataSource(); seedPeriods(); set({ step: "app", tab: "today" }); scheduleMood(25000); break;
    case "switch": ui.moodOpen = false; set({ step: "login" }); break;
    case "reset": try { localStorage.removeItem(STORE_KEY); } catch (err) {} remoteDoc?.delete?.().catch(() => {}); state = defaultState(); ui = { ...ui, sorted: null, draft: "", moodOpen: false }; render(); break;
    case "ai-plan": aiPlan(); break;
    case "book":
      state.booked.push({ start: d.slot, end: toTime(toMin(d.slot) + Number(d.min)), title: d.title }); save();
      bookOnCalendar(d.slot, Number(d.min), d.title).then((live) => toast(live ? `Added to your Google Calendar at ${d.slot}` : `Booked ${d.slot} in HerLife`));
      break;
    case "calendar-connect": window.claude?.use?.("calendar").then((cal) => cal ? cal.connect() : toast("Calendar sign in works on the HerLife web app.")); break;
    case "back-today": set({ previewCd: null }); break;
    case "save-checkin": state.checkins = { ...(state.checkins || {}), [TODAY]: { ...ui.checkinDraft } }; ui.editCheckin = false; applyDataSource(); save(); render(); toast("Check-in saved to your record"); break;
    case "edit-checkin": ui.editCheckin = true; ui.checkinDraft = { ...state.checkins[TODAY] }; render(); break;
    case "oura-sync": ui.ouraBusy = true; render(); (ui.ouraReal ? syncOura() : new Promise((res) => setTimeout(() => res({ mode: "demo", note: "Oura synced. Last night is in." }), 1400))).then((r) => { ui.ouraBusy = false; state.connected.ouraMode = r.mode; save(); render(); toast(r.note); }); break;
    case "period-today": state.periods.push(TODAY); state.previewCd = null; save(); toast("Period logged. Predictions updated."); break;
    case "period-undo": state.periods = state.periods.filter((d) => d !== TODAY); set({}); break;
    case "mood": ui.moodOpen = true; render(); break;
    case "mood-close": if (e.target.closest("[data-stop]") && !t.matches("button")) return; ui.moodOpen = false; render(); break;
    case "mic": toggleMic(); break;
    case "sort": sortLog(); break;
    case "save-log":
      for (const en of ui.sorted.entries) state.logs.push({ id: Date.now() + Math.random(), day: TODAY, ...en });
      ui.sorted = null; ui.draft = ""; save(); toast("Added to your record"); scheduleMood(4000); break;
    case "summary": writeSummary(); break;
    case "copy": {
      const text = `${state.profile.name || "Maya"}: HerLife lifestyle record\n\n${insights().map((i) => "- " + i).join("\n")}\n\n${state.summary || ""}`;
      navigator.clipboard?.writeText(text).then(() => toast("Copied. Paste it into your patient portal message."), () => toast("Copy is blocked here. Select the summary text instead."));
      break;
    }
  }
});
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.dataset.bind) { state.profile[t.dataset.bind] = t.value; save(); }
  if (t.dataset.consent) { state.consent[t.dataset.consent] = t.checked; save(); }
  if (t.hasAttribute("data-draft")) ui.draft = t.value;
  if (t.dataset.ci) { ui.checkinDraft[t.dataset.ci] = Number(t.value); const v = document.getElementById("ci-sleep-val"); if (v) v.textContent = t.value + " h"; }
  if (t.hasAttribute("data-scrub")) { const label = document.getElementById("scrub-label"); if (label) label.textContent = `Day ${t.value}: ${PHASES[phaseOf(Number(t.value))].label}`; }
});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.hasAttribute("data-period-date") && t.value && !state.periods.includes(t.value)) { state.periods.push(t.value); state.previewCd = null; save(); toast(`Period on ${fmtDay(t.value, { month: "short", day: "numeric" })} logged. Predictions updated.`); return; }
  if (t.hasAttribute("data-scrub")) { state.previewCd = Number(t.value) === currentCd() ? null : Number(t.value); save(); render(); document.getElementById("scrub")?.focus(); }
});
function scheduleMood(ms) {
  clearTimeout(scheduleMood.t);
  scheduleMood.t = setTimeout(() => { if (state.step === "app" && !ui.moodOpen && Date.now() - state.lastMoodAt > 90000) { ui.moodOpen = true; render(); } }, ms);
}
if (state.step === "app") seedPeriods();
applyDataSource();
render();
const calendarReturn = new URLSearchParams(location.search).get("calendar");
if (calendarReturn && window.claude?.hosted) {
  history.replaceState(null, "", location.pathname);
  if (calendarReturn !== "connected") toast(calendarReturn === "not_configured" ? "Google sign in isn't set up on this server yet." : "Calendar sign in was cancelled.");
}
if (window.claude?.hosted) loadCalendar().then((ok) => ok && calendarReturn === "connected" && toast("Google Calendar connected. Your real day is on Today."));
const ouraReturn = new URLSearchParams(location.search).get("oura");
if (ouraReturn && window.claude?.hosted) {
  history.replaceState(null, "", location.pathname);
  if (ouraReturn === "connected") syncOura().then((r) => { state.connected.oura = true; state.connected.ouraMode = r.mode; save(); render(); toast(r.note); });
  else toast(ouraReturn === "not_configured" ? OURA_FIX.oura_not_configured : "Oura sign in was cancelled.");
}
connectRecord().then(() => { if (state.connected.ouraMode === "live") syncOura().then((r) => { state.connected.ouraMode = r.mode; render(); }); });
if (state.step === "app") scheduleMood(30000);
</script>
